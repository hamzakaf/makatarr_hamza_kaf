<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة السلم والزحليقة التعليمية</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #f59e0b;
            --accent-hover: #d97706;
            --text-color: #f8fafc;
            --board-bg: #1e293b;
            --grid-border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
            width: 100%;
        }

        h1 {
            color: #fbbf24;
            font-size: clamp(1.2rem, 4vw, 2rem);
            margin-bottom: 4px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: clamp(0.75rem, 2.5vw, 0.95rem);
        }

        .main-container {
            display: flex;
            flex-direction: row-reverse;
            gap: 15px;
            max-width: 1100px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        @media (max-width: 850px) {
            .main-container {
                flex-direction: column;
                align-items: center;
            }
        }

        .controls-panel {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            color: #cbd5e1;
            font-weight: bold;
        }

        select, button {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 12px;
            border-radius: 8px;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #3b82f6;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .status-card {
            background: #0f172a;
            border-radius: 8px;
            padding: 10px;
            border-right: 4px solid var(--accent-color);
            text-align: center;
        }

        .player-turn-display {
            font-size: 1.1rem;
            font-weight: bold;
            color: #38bdf8;
        }

        .players-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: #0f172a;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .player-badge {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-left: 6px;
        }

        .board-container {
            position: relative;
            width: min(92vw, 550px);
            height: min(92vw, 550px);
            background-color: var(--board-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            border: 3px solid #475569;
            touch-action: manipulation;
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            width: 100%;
            height: 100%;
        }

        .cell {
            border: 1px solid var(--grid-border);
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 2px 4px;
            font-size: clamp(0.55rem, 1.8vw, 0.75rem);
            font-weight: bold;
            color: #64748b;
            position: relative;
            user-select: none;
        }

        .cell:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .cell-100 {
            background-color: rgba(245, 158, 11, 0.2) !important;
            color: #fbbf24;
            font-weight: 900;
        }

        #svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .tokens-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        .token {
            position: absolute;
            width: clamp(16px, 4vw, 24px);
            height: clamp(16px, 4vw, 24px);
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.5rem, 1.5vw, 0.7rem);
            font-weight: bold;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
            border: 1px solid #475569;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #475569;
            padding-bottom: 8px;
        }

        .category-badge {
            background: #3b82f6;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .question-text {
            font-size: clamp(0.95rem, 3vw, 1.1rem);
            line-height: 1.5;
            margin-bottom: 15px;
            color: #f8fafc;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .option-btn {
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            text-align: right;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-swap {
            background: transparent;
            border: 1px solid #f59e0b;
            color: #f59e0b;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .log-panel {
            background: #0f172a;
            border-radius: 8px;
            padding: 8px;
            height: 90px;
            overflow-y: auto;
            font-size: 0.75rem;
            color: #94a3b8;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-entry.success { color: #4ade80; }
        .log-entry.danger { color: #f87171; }
        .log-entry.info { color: #38bdf8; }
    </style>
</head>
<body>

    <header>
        <h1>لعبة السلم والزحليقة التعليمية</h1>
        <p class="subtitle">أجب على الأسئلة للتقدم وتجنب الزحاليق واصعد السلالم!</p>
    </header>

    <div class="main-container">
        
        <div class="controls-panel">
            <div class="panel-group">
                <label for="category-select">اختر القسم / المادة:</label>
                <select id="category-select" onchange="changeCategory()">
                    <option value="math">الرياضيات</option>
                    <option value="science">العلوم</option>
                    <option value="hadith">الحديث</option>
                    <option value="fiqh">الفقه</option>
                    <option value="geo">الجغرافيا</option>
                    <option value="arabic">اللغة العربية</option>
                    <option value="mixed" selected>متنوع (جميع المواد)</option>
                </select>
            </div>

            <div class="panel-group">
                <label for="player-count">عدد اللاعبين:</label>
                <select id="player-count" onchange="resetGame()">
                    <option value="2">2 لاعبين</option>
                    <option value="3">3 لاعبين</option>
                    <option value="4">4 لاعبين</option>
                </select>
            </div>

            <button class="btn-primary" onclick="triggerQuestion()">إظهار السؤال 🎲</button>

            <div class="status-card">
                <label style="font-size: 0.75rem;">الدور الحالي:</label>
                <div class="player-turn-display" id="turn-display">اللاعب 1</div>
            </div>

            <div class="panel-group">
                <label>مواقع اللاعبين:</label>
                <div class="players-list" id="players-list"></div>
            </div>

            <div class="panel-group">
                <label>سجل الأحداث:</label>
                <div class="log-panel" id="log-panel"></div>
            </div>

            <button class="btn-secondary" onclick="resetGame()" style="padding: 8px;">إعادة لعبة جديدة 🔄</button>
        </div>

        <div class="board-container">
            <div class="board-grid" id="board-grid"></div>
            <svg id="svg-overlay"></svg>
            <div class="tokens-overlay" id="tokens-overlay"></div>
        </div>

    </div>

    <div class="modal" id="question-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="category-badge" id="modal-category">الرياضيات</span>
                <span style="font-size: 0.75rem; color: #94a3b8;" id="modal-steps">التقدم: 2 خطوات</span>
            </div>
            <div class="question-text" id="modal-question">جارِ تحميل السؤال...</div>
            <div class="options-container" id="modal-options"></div>
            <div style="display: flex; justify-content: flex-end;">
                <button class="btn-swap" onclick="swapQuestion()">🔄 تبديل السؤال</button>
            </div>
        </div>
    </div>

    <script>
        const playerColors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b'];
        const playerNames = ['اللاعب 1', 'اللاعب 2', 'اللاعب 3', 'اللاعب 4'];
        
        let players = [];
        let currentPlayerIndex = 0;
        let activeCategory = 'mixed';
        let currentQuestionObj = null;
        let usedQuestions = new Set();

        const ladders = [
            { start: 4, end: 14, color: '#4ade80' },
            { start: 9, end: 31, color: '#38bdf8' },
            { start: 20, end: 38, color: '#facc15' },
            { start: 28, end: 84, color: '#a855f7' },
            { start: 40, end: 59, color: '#fb923c' },
            { start: 63, end: 81, color: '#f43f5e' },
            { start: 71, end: 91, color: '#2dd4bf' }
        ];

        const slides = [
            { start: 17, end: 7, color: '#ec4899' },
            { start: 54, end: 34, color: '#eab308' },
            { start: 62, end: 19, color: '#06b6d4' },
            { start: 64, end: 60, color: '#8b5cf6' },
            { start: 87, end: 24, color: '#ef4444' },
            { start: 93, end: 73, color: '#10b981' },
            { start: 99, end: 78, color: '#f97316' }
        ];

        const questionGenerators = {
            math: () => {
                const type = Math.floor(Math.random() * 4);
                let q, ans, opts;
                if (type === 0) {
                    const a = Math.floor(Math.random() * 40) + 10;
                    const b = Math.floor(Math.random() * 40) + 10;
                    q = `ما حاصل جمع ${a} + ${b}؟`;
                    ans = a + b;
                    opts = [ans, ans + 2, ans - 3, ans + 5];
                } else if (type === 1) {
                    const a = Math.floor(Math.random() * 10) + 2;
                    const b = Math.floor(Math.random() * 10) + 2;
                    q = `ما حاصل ضرب ${a} × ${b}؟`;
                    ans = a * b;
                    opts = [ans, ans + a, ans - b, ans + 4];
                } else if (type === 2) {
                    const a = Math.floor(Math.random() * 50) + 20;
                    const b = Math.floor(Math.random() * 20) + 1;
                    q = `ما حاصل طرح ${a} - ${b}؟`;
                    ans = a - b;
                    opts = [ans, ans + 1, ans - 2, ans + 3];
                } else {
                    const b = Math.floor(Math.random() * 8) + 2;
                    const ansVal = Math.floor(Math.random() * 8) + 2;
                    const a = b * ansVal;
                    q = `ما حاصل قسمة ${a} ÷ ${b}؟`;
                    ans = ansVal;
                    opts = [ans, ans + 1, ans + 2, Math.max(1, ans - 1)];
                }
                opts = Array.from(new Set(opts)).sort(() => Math.random() - 0.5);
                return { question: q, options: opts.map(String), answer: String(ans), cat: 'الرياضيات' };
            },
            science: () => {
                const staticQ = [
                    { q: "ما هو الكوكب الأقرب إلى الشمس؟", opts: ["عطارد", "الزهرة", "الأرض", "المريخ"], ans: "عطارد" },
                    { q: "ما هو العنصر الكيميائي الذي رمزه O؟", opts: ["الأكسجين", "الذهب", "الهيدروجين", "الحديد"], ans: "الأكسجين" },
                    { q: "ما هي العضو المسئول عن ضخ الدم في جسم الإنسان؟", opts: ["القلب", "الرئتان", "الكبد", "الدماغ"], ans: "القلب" },
                    { q: "ما الغاز الذي تنتجه النباتات أثناء البناء الضوئي؟", opts: ["الأكسجين", "ثاني أكسيد الكربون", "النيتروجين", "الهيليوم"], ans: "الأكسجين" }
                ];
                const item = staticQ[Math.floor(Math.random() * staticQ.length)];
                return { question: item.q, options: item.opts.sort(() => Math.random() - 0.5), answer: item.ans, cat: 'العلوم' };
            },
            hadith: () => {
                const staticQ = [
                    { q: "من القائل: 'إنما الأعمال بالنيات'؟", opts: ["الرسول محمد ﷺ", "أبو بكر الصديق", "عمر بن الخطاب", "علي بن أبي طالب"], ans: "الرسول محمد ﷺ" },
                    { q: "أكثر الصحابة رواية للحديث النبوي الشريف هو:", opts: ["أبو هريرة رضي الله عنه", "أنس بن مالك", "عبدالله بن عمر", "ابن عباس"], ans: "أبو هريرة رضي الله عنه" }
                ];
                const item = staticQ[Math.floor(Math.random() * staticQ.length)];
                return { question: item.q, options: item.opts.sort(() => Math.random() - 0.5), answer: item.ans, cat: 'الحديث' };
            },
            fiqh: () => {
                const staticQ = [
                    { q: "كم عدد أركان الإسلام؟", opts: ["5", "6", "4", "7"], ans: "5" },
                    { q: "الشرط الأساسي لصحة الصلاة هو:", opts: ["الوضوء والطهارة", "الصدقة", "الصيام", "قراءة السور الطويلة"], ans: "الوضوء والطهارة" }
                ];
                const item = staticQ[Math.floor(Math.random() * staticQ.length)];
                return { question: item.q, options: item.opts.sort(() => Math.random() - 0.5), answer: item.ans, cat: 'الفقه' };
            },
            geo: () => {
                const staticQ = [
                    { q: "ما هي أكبر قارة في العالم من حيث المساحة؟", opts: ["آسيا", "أفريقيا", "أوروبا", "أمريكا الشمالية"], ans: "آسيا" },
                    { q: "ما عاصمة المملكة العربية السعودية؟", opts: ["الرياض", "جدة", "مكة المكرمة", "الدمام"], ans: "الرياض" }
                ];
                const item = staticQ[Math.floor(Math.random() * staticQ.length)];
                return { question: item.q, options: item.opts.sort(() => Math.random() - 0.5), answer: item.ans, cat: 'الجغرافيا' };
            },
            arabic: () => {
                const staticQ = [
                    { q: "ما هو الجمع الصحيح لكلمة 'كتاب'؟", opts: ["كتب", "كتابات", "كتّاب", "أكتبة"], ans: "كتب" },
                    { q: "عكس كلمة 'الأمل' هو:", opts: ["البيأس", "الخوف", "الحزن", "الغضب"], ans: "البيأس" }
                ];
                const item = staticQ[Math.floor(Math.random() * staticQ.length)];
                return { question: item.q, options: item.opts.sort(() => Math.random() - 0.5), answer: item.ans, cat: 'اللغة العربية' };
            }
        };

        function initBoard() {
            const grid = document.getElementById('board-grid');
            grid.innerHTML = '';

            for (let row = 9; row >= 0; row--) {
                const isEvenRow = (9 - row) % 2 === 1;
                for (let col = 0; col < 10; col++) {
                    const actualCol = isEvenRow ? (9 - col) : col;
                    const cellNum = row * 10 + actualCol + 1;
                    
                    const cell = document.createElement('div');
                    cell.className = `cell ${cellNum === 100 ? 'cell-100' : ''}`;
                    cell.id = `cell-${cellNum}`;
                    cell.innerText = cellNum;
                    grid.appendChild(cell);
                }
            }

            setTimeout(drawLaddersAndSlides, 100);
        }

        function getCellCoords(num) {
            const cell = document.getElementById(`cell-${num}`);
            if (!cell) return { x: 0, y: 0 };

            const boardRect = document.getElementById('board-grid').getBoundingClientRect();
            const cellRect = cell.getBoundingClientRect();

            return {
                x: cellRect.left - boardRect.left + cellRect.width / 2,
                y: cellRect.top - boardRect.top + cellRect.height / 2
            };
        }

        function drawLaddersAndSlides() {
            const svg = document.getElementById('svg-overlay');
            svg.innerHTML = '';

            ladders.forEach((ladder) => {
                const start = getCellCoords(ladder.start);
                const end = getCellCoords(ladder.end);

                const angle = Math.atan2(end.y - start.y, end.x - start.x);
                const offsetX = Math.sin(angle) * 6;
                const offsetY = -Math.cos(angle) * 6;

                const line1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line1.setAttribute('x1', start.x + offsetX);
                line1.setAttribute('y1', start.y + offsetY);
                line1.setAttribute('x2', end.x + offsetX);
                line1.setAttribute('y2', end.y + offsetY);
                line1.setAttribute('stroke', ladder.color);
                line1.setAttribute('stroke-width', '3');

                const line2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line2.setAttribute('x1', start.x - offsetX);
                line2.setAttribute('y1', start.y - offsetY);
                line2.setAttribute('x2', end.x - offsetX);
                line2.setAttribute('y2', end.y - offsetY);
                line2.setAttribute('stroke', ladder.color);
                line2.setAttribute('stroke-width', '3');

                svg.appendChild(line1);
                svg.appendChild(line2);

                const stepsCount = 6;
                for (let i = 1; i < stepsCount; i++) {
                    const stepX = start.x + (end.x - start.x) * (i / stepsCount);
                    const stepY = start.y + (end.y - start.y) * (i / stepsCount);

                    const step = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    step.setAttribute('x1', stepX + offsetX);
                    step.setAttribute('y1', stepY + offsetY);
                    step.setAttribute('x2', stepX - offsetX);
                    step.setAttribute('y2', stepY - offsetY);
                    step.setAttribute('stroke', ladder.color);
                    step.setAttribute('stroke-width', '2.5');
                    svg.appendChild(step);
                }
            });

            slides.forEach((slide) => {
                const start = getCellCoords(slide.start);
                const end = getCellCoords(slide.end);

                const midX = (start.x + end.x) / 2 + (start.x < end.x ? 25 : -25);
                const midY = (start.y + end.y) / 2 - 15;

                const pathD = `M ${start.x} ${start.y} Q ${midX} ${midY} ${end.x} ${end.y}`;

                const outerBorder = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                outerBorder.setAttribute('d', pathD);
                outerBorder.setAttribute('stroke', slide.color);
                outerBorder.setAttribute('stroke-width', '12');
                outerBorder.setAttribute('fill', 'none');
                outerBorder.setAttribute('stroke-linecap', 'round');

                const innerTrack = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                innerTrack.setAttribute('d', pathD);
                innerTrack.setAttribute('stroke', '#ffffff');
                innerTrack.setAttribute('stroke-width', '7');
                innerTrack.setAttribute('fill', 'none');
                innerTrack.setAttribute('stroke-linecap', 'round');

                svg.appendChild(outerBorder);
                svg.appendChild(innerTrack);

                const earLeft = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                earLeft.setAttribute('cx', start.x - 5);
                earLeft.setAttribute('cy', start.y - 5);
                earLeft.setAttribute('r', '4');
                earLeft.setAttribute('fill', slide.color);

                const earRight = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                earRight.setAttribute('cx', start.x + 5);
                earRight.setAttribute('cy', start.y - 5);
                earRight.setAttribute('r', '4');
                earRight.setAttribute('fill', slide.color);

                svg.appendChild(earLeft);
                svg.appendChild(earRight);
            });
        }

        function resetGame() {
            const count = parseInt(document.getElementById('player-count').value);
            players = [];

            for (let i = 0; i < count; i++) {
                players.push({
                    id: i,
                    name: playerNames[i],
                    color: playerColors[i],
                    position: 1
                });
            }

            currentPlayerIndex = 0;
            usedQuestions.clear();
            renderPlayersList();
            renderTokens();
            updateTurnDisplay();
            logEvent("بدأت لعبة جديدة!", "info");
        }

        function renderPlayersList() {
            const list = document.getElementById('players-list');
            list.innerHTML = '';

            players.forEach(p => {
                const item = document.createElement('div');
                item.className = 'player-item';
                item.innerHTML = `
                    <div>
                        <span class="player-badge" style="background: ${p.color};"></span>
                        <span>${p.name}</span>
                    </div>
                    <span style="font-weight: bold; color: #fbbf24;">المربع ${p.position}</span>
                `;
                list.appendChild(item);
            });
        }

        function renderTokens() {
            const overlay = document.getElementById('tokens-overlay');
            overlay.innerHTML = '';

            players.forEach(p => {
                const coords = getCellCoords(p.position);
                const token = document.createElement('div');
                token.className = 'token';
                token.style.left = `${coords.x}px`;
                token.style.top = `${coords.y}px`;
                token.style.backgroundColor = p.color;
                token.innerText = p.id + 1;
                overlay.appendChild(token);
            });
        }

        function updateTurnDisplay() {
            const p = players[currentPlayerIndex];
            const display = document.getElementById('turn-display');
            display.innerText = p.name;
            display.style.color = p.color;
        }

        function changeCategory() {
            activeCategory = document.getElementById('category-select').value;
        }

        function fetchQuestion() {
            let catKey = activeCategory;
            if (catKey === 'mixed') {
                const keys = ['math', 'science', 'hadith', 'fiqh', 'geo', 'arabic'];
                catKey = keys[Math.floor(Math.random() * keys.length)];
            }

            const gen = questionGenerators[catKey];
            let qObj = gen();

            let attempts = 0;
            while (usedQuestions.has(qObj.question) && attempts < 10) {
                qObj = gen();
                attempts++;
            }

            usedQuestions.add(qObj.question);
            qObj.steps = Math.floor(Math.random() * 3) + 1;
            return qObj;
        }

        function triggerQuestion() {
            currentQuestionObj = fetchQuestion();

            document.getElementById('modal-category').innerText = currentQuestionObj.cat;
            document.getElementById('modal-steps').innerText = `التقدم: ${currentQuestionObj.steps} خطوات`;
            document.getElementById('modal-question').innerText = currentQuestionObj.question;

            const optsContainer = document.getElementById('modal-options');
            optsContainer.innerHTML = '';

            currentQuestionObj.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(opt);
                optsContainer.appendChild(btn);
            });

            document.getElementById('question-modal').classList.add('active');
        }

        function swapQuestion() {
            triggerQuestion();
        }

        function handleAnswer(selectedOpt) {
            document.getElementById('question-modal').classList.remove('active');
            const p = players[currentPlayerIndex];

            if (selectedOpt === currentQuestionObj.answer) {
                logEvent(`إجابة صحيحة! يتقدم ${p.name} ${currentQuestionObj.steps} خطوات.`, 'success');
                movePlayer(p, currentQuestionObj.steps);
            } else {
                logEvent(`إجابة خاطئة من ${p.name}. الإجابة هي (${currentQuestionObj.answer}).`, 'danger');
                nextTurn();
            }
        }

        function movePlayer(player, steps) {
            let targetPos = player.position + steps;
            if (targetPos > 100) {
                targetPos = 100 - (targetPos - 100);
            }

            player.position = targetPos;
            renderTokens();
            renderPlayersList();

            setTimeout(() => {
                checkLaddersAndSlides(player);
            }, 400);
        }

        function checkLaddersAndSlides(player) {
            const ladder = ladders.find(l => l.start === player.position);
            if (ladder) {
                logEvent(`صعد ${player.name} السلم إلى المربع ${ladder.end}! 🪜`, 'success');
                player.position = ladder.end;
                renderTokens();
                renderPlayersList();
            }

            const slide = slides.find(s => s.start === player.position);
            if (slide) {
                logEvent(`انزلق ${player.name} بالزحليقة إلى المربع ${slide.end}! 🛝`, 'danger');
                player.position = slide.end;
                renderTokens();
                renderPlayersList();
            }

            if (player.position === 100) {
                logEvent(`🎉 فاز ${player.name} باللعبة! 🏆`, 'success');
                alert(`🎉 مبروك! فاز ${player.name} باللعبة!`);
                return;
            }

            nextTurn();
        }

        function nextTurn() {
            currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            updateTurnDisplay();
        }

        function logEvent(msg, type = 'info') {
            const panel = document.getElementById('log-panel');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerText = `• ${msg}`;
            panel.prepend(entry);
        }

        window.addEventListener('resize', () => {
            drawLaddersAndSlides();
            renderTokens();
        });

        initBoard();
        resetGame();
    </script>
</body>
</html>
