onst e=S.cards[t].id==="timed";voteRun={i:t,deadline:Date.now()+raceSeconds()*1e3,token:roundGeneration};if(e){document.querySelector("#m .cd").insertAdjacentHTML("afterbegin",`<div class="race-timer" role="timer">⏳ باقي <b id="race-seconds">${raceSeconds()}</b> ثانية</div><p class="mu">عند انتهاء الوقت تُحسب اختياراتك الحالية تلقائيًا.</p>`);voteClock=setInterval(checkRace,100)}};function checkRace(){if(!voteRun||S.cards[voteRun.i]?.id!=="timed")return;if(voteRun.token!==roundGeneration||!S.inRound){clearInterval(voteClock);return}const t=Math.max(0,Math.ceil((voteRun.deadline-Date.now())/1e3));if($("race-seconds"))$("race-seconds").textContent=t;if(!t)sub(voteRun.i,true)}document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkRace()});window.addEventListener("pageshow",checkRace);function sub(t,e=false){if(!voteRun||voteRun.i!==t||!S.inRound)return;const s=S.cards[t].id==="timed",a=[];if(e&&(!s||Date.now()<voteRun.deadline))return;for(let e=0;e<n();e++)if(e!==t){const t=$("g"+e)?.value||"";if(!t&&!s)return alert("اختر لكل لاعب");a[e]=t}clearInterval(voteClock);voteRun=null;S.gs[t]=a;t+1<n()?vp(t+1):calc()}function fin(){stopRoundClocks();S.inRound=false;const{pts:t,lg:e}=S.cur;if(S.ap!==S.r){S.pl.forEach((e,n)=>S.sc[n]+=t[n]);S.ap=S.r}S.awaitingNext=true;scr(`<h2>نتيجة ${roundLabel()}</h2>${S.pl.map((n,s)=>`<div class="cd"><div class="rw"><span>${esc(n)} — <b class="y">${esc(S.items[s])}</b></span><b>${t[s]>0?"+":""}${t[s]} (المجموع ${S.sc[s]})</b></div>${e[s].map(t=>`<small class="mu">${t}</small>`).join("")}</div>`).join("")}<div class="cd"><h2>الترتيب</h2>${S.pl.map((t,e)=>({p:t,s:S.sc[e]})).sort((t,e)=>e.s-t.s).map(t=>`<div class="rw"><span>${esc(t.p)}</span><b class="y">${t.s}</b></div>`).join("")}</div>${S.r+1<(S.rounds||4)?'<button class="b1" onclick="nextRound()">الجولة التالية ←</button>':'<button class="b1" onclick="finishSession()">إعلان الفائز 🏆</button>'}`)}function nextRound(){if(!S.awaitingNext||S.r+1>=(S.rounds||4))return;S.awaitingNext=false;S.r++;S.tbd=0;S.tw=[];cats()}home();how()</script> </body> </html>
